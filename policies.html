<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>POLICIES | JOM STUDIO</title>
  <link rel="canonical" href="https://jomstudio.site/policies" />
  <meta name="theme-color" content="#080808" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="description" content="JOM STUDIO work policies — revisions, timelines, abandonment, refunds."/>
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="JOM STUDIO" />
  <meta property="og:title" content="POLICIES | JOM STUDIO" />
  <meta property="og:description" content="JOM STUDIO work policies — revisions, timelines, abandonment, refunds." />
  <meta property="og:url" content="https://jomstudio.site/policies" />
  <meta property="og:image" content="https://jomstudio.site/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="POLICIES | JOM STUDIO" />
  <meta name="twitter:image" content="https://jomstudio.site/assets/og-image.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root { --c:#00F2FF; --g:#C4A35A; --bg:#050505; }
    body { background:var(--bg); color:#e0e0e0; font-family:Sora,system-ui,sans-serif; overflow-x:hidden; }
    .mono { font-family:"JetBrains Mono",monospace; }
    .glass { background:rgba(10,10,10,.94); border:1px solid #4a4a4a; }
    .btn-p { background:var(--c); color:#050505; font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; border:1px solid var(--c); }
    .btn-p:hover { background:transparent; color:var(--c); }
    h1,h2 { overflow-wrap:anywhere; word-break:break-word; }
    section.policy h2 { color:var(--c); font-size:1.05rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:.75rem; }
    section.policy ul { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:.55rem; }
    section.policy li { font-size:.875rem; color:#c8c8c8; line-height:1.55; padding-left:1rem; border-left:2px solid rgba(0,242,255,.25); }
  </style>
  <script src="js/config.js?v=4"></script>
  <script src="js/i18n-commerce.js?v=4"></script>
  <script src="js/policies.js?v=4"></script>
  <script src="js/events.js?v=1" defer></script>
</head>
<body class="min-h-screen">
  <header class="fixed top-0 inset-x-0 z-50 flex flex-wrap justify-between items-center gap-2 px-3 sm:px-6 py-3 bg-black/85 backdrop-blur border-b border-white/10">
    <a href="/" class="flex items-center gap-2 min-w-0">
      <img src="assets/logo-icon.png" alt="JOM" class="w-7 h-7 object-cover"/>
      <span class="mono text-[10px] sm:text-xs tracking-widest text-cyan-300">JOM STUDIO // <span id="nav-pol">POLICIES</span></span>
    </a>
    <div class="flex items-center gap-2 sm:gap-3">
      <a href="/services" class="mono text-[10px] text-gray-400 hover:text-cyan-300 uppercase" id="nav-pricing">Pricing</a>
      <div class="relative group">
        <button type="button" class="mono text-[10px] border border-white/20 px-2 py-1 flex items-center gap-1">
          <span id="lang-label">ES</span>
          <span style="font-size:14px">🌐</span>
        </button>
        <div class="absolute right-0 top-full mt-1 w-32 bg-black border border-white/20 z-50 opacity-0 invisible group-hover:opacity-100 group-hover:visible flex flex-col">
          <button type="button" class="lang-opt text-left px-3 py-2 mono text-[10px] text-gray-400 hover:text-cyan-300" data-lang="en">🇺🇸 EN</button>
          <button type="button" class="lang-opt text-left px-3 py-2 mono text-[10px] text-gray-400 hover:text-cyan-300" data-lang="es">🇪🇸 ES</button>
          <button type="button" class="lang-opt text-left px-3 py-2 mono text-[10px] text-gray-400 hover:text-cyan-300" data-lang="fr">🇫🇷 FR</button>
          <button type="button" class="lang-opt text-left px-3 py-2 mono text-[10px] text-gray-400 hover:text-cyan-300" data-lang="pt">🇧🇷 PT</button>
          <button type="button" class="lang-opt text-left px-3 py-2 mono text-[10px] text-gray-400 hover:text-cyan-300 border-t border-white/10" data-lang="auto">🌐 AUTO</button>
        </div>
      </div>
      <a href="/services" class="btn-p px-3 py-1.5 rounded" id="cta-buy">Packages</a>
    </div>
  </header>

  <main class="pt-24 sm:pt-28 pb-20 px-4 sm:px-6 max-w-3xl mx-auto">
    <div class="mb-8 space-y-3">
      <p class="mono text-[10px] text-cyan-300 tracking-widest" id="version-line"></p>
      <h1 class="text-2xl sm:text-4xl font-bold uppercase tracking-tight" id="hero-title"></h1>
      <p class="text-sm text-gray-400" id="hero-sub"></p>
    </div>

    <div class="glass rounded-xl p-4 sm:p-5 mb-8 border border-amber-500/30">
      <h2 class="mono text-xs text-amber-300 tracking-widest uppercase mb-3" id="summary-title"></h2>
      <ul class="space-y-2 text-sm text-gray-200" id="summary-list"></ul>
    </div>

    <div id="sections" class="space-y-6"></div>

    <p class="mt-10 text-xs text-gray-500 mono leading-relaxed" id="accept-note"></p>

    <div class="mt-8 flex flex-wrap gap-3">
      <a href="/services" class="btn-p px-4 py-2.5 rounded" id="back-pricing"></a>
      <a href="/order?product=launch" class="mono text-[11px] uppercase tracking-wider px-4 py-2.5 border border-white/20 rounded hover:border-cyan-400 text-gray-300">Launch Kit 300 USDT</a>
    </div>
  </main>

  <footer class="border-t border-white/10 py-8 text-center text-xs mono text-gray-500">
    © 2026 JOM STUDIO · USDT TRC20
  </footer>

  <script>
    (function () {
      let langMode = JOM_I18N.getStoredLangMode();

      function L() {
        return JOM_I18N.resolveLang(langMode);
      }

      function render() {
        const lang = L();
        const B = JOM_POLICIES.tBlock(lang);
        const P = JOM_POLICIES.data;
        document.documentElement.lang = lang;
        document.title = B.page_title;
        document.getElementById("lang-label").textContent = langMode === "auto" ? "AUTO" : lang.toUpperCase();
        document.getElementById("nav-pol").textContent = B.nav_policies;
        document.getElementById("nav-pricing").textContent = JOM_I18N.t("nav_pricing", lang);
        document.getElementById("cta-buy").textContent = B.cta_buy;
        document.getElementById("version-line").textContent =
          B.updated + " " + P.version + " · " + P.effectiveFrom;
        document.getElementById("hero-title").textContent = B.hero_title;
        document.getElementById("hero-sub").textContent = B.hero_sub;
        document.getElementById("summary-title").textContent = B.summary_title;
        document.getElementById("summary-list").innerHTML = (B.summary_items || [])
          .map((s) => `<li class="flex gap-2"><span class="text-cyan-400">✓</span><span>${s}</span></li>`)
          .join("");
        document.getElementById("accept-note").textContent = B.accept_note;
        document.getElementById("back-pricing").textContent = B.back_pricing;

        const keys = [
          ["s1_title", "s1_body"],
          ["s2_title", "s2_body"],
          ["s3_title", "s3_body"],
          ["s4_title", "s4_body"],
          ["s5_title", "s5_body"],
          ["s6_title", "s6_body"],
          ["s7_title", "s7_body"],
        ];
        document.getElementById("sections").innerHTML = keys
          .map(([tk, bk]) => {
            const title = B[tk] || "";
            const items = B[bk] || [];
            return `<section class="policy glass rounded-xl p-4 sm:p-6">
              <h2>${title}</h2>
              <ul>${items.map((li) => `<li>${li}</li>`).join("")}</ul>
            </section>`;
          })
          .join("");
      }

      document.querySelectorAll(".lang-opt").forEach((btn) => {
        btn.addEventListener("click", () => {
          langMode = btn.dataset.lang;
          JOM_I18N.setStoredLangMode(langMode);
          render();
        });
      });
      window.addEventListener("storage", (e) => {
        if (e.key === "jom_lang") {
          langMode = e.newValue || "auto";
          render();
        }
      });

      render();
    })();
  </script>
</body>
</html>
