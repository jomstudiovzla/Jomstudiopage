<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CHECKOUT USDT | JOM STUDIO</title>
  <link rel="canonical" href="https://jomstudio.site/order" />
  <meta name="theme-color" content="#080808" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="description" content="Checkout USDT TRC20 for a JOM STUDIO package." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="JOM STUDIO" />
  <meta property="og:title" content="CHECKOUT USDT | JOM STUDIO" />
  <meta property="og:description" content="Checkout USDT TRC20 for a JOM STUDIO package." />
  <meta property="og:url" content="https://jomstudio.site/order" />
  <meta property="og:image" content="https://jomstudio.site/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="CHECKOUT USDT | JOM STUDIO" />
  <meta name="twitter:image" content="https://jomstudio.site/assets/og-image.png" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    :root { --c:#00F2FF; --g:#C4A35A; --bg:#050505; }
    body { background:var(--bg); color:#e0e0e0; font-family:Sora,system-ui,sans-serif; overflow-x:hidden; }
    .glass { background:rgba(10,10,10,.94); border:1px solid #4a4a4a; backdrop-filter:blur(24px); }
    .mono { font-family:"JetBrains Mono",monospace; }
    .btn { background:var(--c); color:#050505; font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; border:1px solid var(--c); }
    .btn:hover { background:transparent; color:var(--c); }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .step { border-left:2px solid rgba(0,242,255,.35); }
    input, textarea { background:#0a0a0a; border:1px solid #333; color:#eee; border-radius:8px; padding:.75rem 1rem; width:100%; }
    input:focus, textarea:focus { outline:none; border-color:var(--c); }
    .addr { word-break:break-all; }
    h1,h2 { overflow-wrap:anywhere; word-break:break-word; }
  </style>
  <script src="js/config.js?v=4"></script>
  <script src="js/i18n-commerce.js?v=4"></script>
  <script src="js/policies.js?v=4"></script>
  <script src="js/crm.js?v=4"></script>
  <script src="js/tron.js?v=4"></script>
  <script src="js/commerce.js?v=5"></script>
  <script src="js/events.js?v=1" defer></script>
</head>
<body class="min-h-screen py-6 sm:py-8 px-4">
  <div class="max-w-5xl mx-auto">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6 sm:mb-8">
      <a href="/services" class="mono text-xs text-cyan-300 hover:underline" data-i18n="back_packages">← Packages</a>
      <div class="relative group">
        <button type="button" id="lang-toggle" class="mono text-[10px] border border-white/20 px-2 py-1 flex items-center gap-1">
          <span id="lang-label">EN</span>
          <span class="material-symbols-outlined text-[14px]">language</span>
        </button>
        <div id="lang-menu" class="absolute right-0 top-full mt-1 w-32 bg-black border border-white/20 z-50 opacity-0 invisible group-hover:opacity-100 group-hover:visible flex flex-col">
          <button type="button" class="lang-opt text-left px-3 py-2 mono text-[10px] text-gray-400 hover:text-cyan-300" data-lang="en">🇺🇸 EN</button>
          <button type="button" class="lang-opt text-left px-3 py-2 mono text-[10px] text-gray-400 hover:text-cyan-300" data-lang="es">🇪🇸 ES</button>
          <button type="button" class="lang-opt text-left px-3 py-2 mono text-[10px] text-gray-400 hover:text-cyan-300" data-lang="fr">🇫🇷 FR</button>
          <button type="button" class="lang-opt text-left px-3 py-2 mono text-[10px] text-gray-400 hover:text-cyan-300" data-lang="pt">🇧🇷 PT</button>
          <button type="button" class="lang-opt text-left px-3 py-2 mono text-[10px] text-gray-400 hover:text-cyan-300 border-t border-white/10" data-lang="auto">🌐 AUTO</button>
        </div>
      </div>
      <a href="/" class="mono text-xs text-gray-400 hover:text-white" data-i18n="nav_home">Home</a>
    </div>

    <div class="grid lg:grid-cols-5 gap-5 sm:gap-6">
      <aside class="lg:col-span-2 glass rounded-xl p-5 sm:p-6 space-y-3 h-fit lg:sticky lg:top-6 min-w-0">
        <div class="mono text-[10px] text-cyan-300 tracking-widest" data-i18n="order_summary">ORDER SUMMARY</div>
        <h1 id="p-name" class="text-xl sm:text-2xl font-bold uppercase tracking-tight">—</h1>
        <p id="p-headline" class="text-sm text-gray-400"></p>
        <div class="text-3xl sm:text-4xl font-bold mono text-cyan-300"><span id="p-price">0</span> <span id="p-price-unit" class="text-base text-gray-400">USDT</span></div>
        <p class="mono text-xs text-gray-500"><span data-i18n="eta_label">ETA</span>: <span id="p-eta">—</span> · <span id="p-network">TRC20</span></p>
        <div id="p-bundle-compare" class="hidden text-xs mono text-amber-200 border border-amber-500/30 rounded p-2"></div>
        <ul id="p-deliverables" class="text-xs text-gray-300 space-y-1.5 border-t border-white/10 pt-4"></ul>
        <div id="rev-note" class="text-[11px] mono text-cyan-200/90 border border-cyan-500/20 rounded p-2"></div>
        <div id="wallet-warn" class="hidden text-xs mono text-amber-300 border border-amber-500/40 rounded p-3"></div>
        <div class="border border-amber-500/30 rounded p-3 space-y-2">
          <div class="mono text-[10px] text-amber-300 tracking-widest uppercase" data-i18n="policies_box_title">Policies</div>
          <ul id="order-policy-summary" class="text-[11px] text-gray-400 space-y-1"></ul>
          <label class="flex items-start gap-2 text-[11px] text-gray-300 cursor-pointer">
            <input type="checkbox" id="accept-policies" required class="mt-0.5 accent-cyan-400"/>
            <span data-i18n="policies_accept">Accept policies</span>
          </label>
          <a href="/policies" target="_blank" rel="noopener noreferrer" class="mono text-[10px] text-cyan-300 hover:underline" data-i18n="policies_link">Full policies</a>
        </div>
      </aside>

      <section class="lg:col-span-3 space-y-5 min-w-0">
        <div class="glass rounded-xl p-5 sm:p-6 step pl-5 sm:pl-6">
          <h2 class="mono text-xs text-cyan-300 tracking-widest mb-4" data-i18n="order_step1">01 · CLIENT DATA</h2>
          <form id="order-form" class="space-y-4">
            <div class="grid md:grid-cols-2 gap-4">
              <div>
                <label class="mono text-[10px] text-gray-500 uppercase" for="name" data-i18n="order_name">Name</label>
                <input id="name" required autocomplete="name"/>
              </div>
              <div>
                <label class="mono text-[10px] text-gray-500 uppercase" for="email" data-i18n="order_email">Email</label>
                <input id="email" type="email" required autocomplete="email"/>
              </div>
            </div>
            <div>
              <label class="mono text-[10px] text-gray-500 uppercase" for="phone" data-i18n="order_phone">WhatsApp</label>
              <input id="phone" autocomplete="tel"/>
            </div>
            <div>
              <label class="mono text-[10px] text-gray-500 uppercase" for="brief" data-i18n="order_brief">Brief</label>
              <textarea id="brief" rows="3" maxlength="500" required></textarea>
            </div>
            <button type="submit" class="btn w-full py-3 rounded" id="btn-create" data-i18n="order_create">Create order →</button>
          </form>
        </div>

        <div id="pay-panel" class="hidden glass rounded-xl p-5 sm:p-6 step pl-5 sm:pl-6 space-y-4">
          <h2 class="mono text-xs text-cyan-300 tracking-widest" data-i18n="order_step2">02 · PAY USDT TRC20</h2>
          <p class="text-sm text-gray-400">
            <span class="mono text-white" id="order-id"></span> —
            <span data-i18n="order_pay_hint">Send exactly</span>
            <strong id="pay-amount" class="text-cyan-300"></strong> USDT
            <span data-i18n="order_network">on</span>
            <strong class="text-amber-300">TRC20</strong>.
          </p>
          <div class="flex flex-col sm:flex-row gap-5 items-center">
            <img id="qr-img" src="assets/commerce/qr_300usdt.png" width="192" height="192" alt="QR USDT TRC20" class="w-44 h-44 sm:w-48 sm:h-48 rounded-lg border border-cyan-500/30 bg-black"/>
            <div class="flex-1 w-full space-y-3">
              <div>
                <div class="mono text-[10px] text-gray-500 mb-1">WALLET TRC20</div>
                <div class="flex gap-2">
                  <code id="wallet-addr" class="addr flex-1 text-xs bg-black/60 border border-white/10 rounded p-3 mono text-cyan-200"></code>
                  <button type="button" id="btn-copy" class="btn px-3 rounded text-[10px]" data-i18n="order_copy">Copy</button>
                </div>
              </div>
              <pre id="order-steps" class="text-xs text-gray-400 whitespace-pre-wrap mono leading-relaxed"></pre>
            </div>
          </div>
          <div>
            <label class="mono text-[10px] text-gray-500 uppercase" for="txHash" data-i18n="order_hash">Tx Hash</label>
            <input id="txHash" class="mono text-sm"/>
          </div>
          <div class="flex flex-col sm:flex-row gap-3">
            <button type="button" id="btn-verify" class="btn flex-1 py-3 rounded" data-i18n="order_verify">Verify</button>
            <button type="button" id="btn-wa" class="flex-1 py-3 rounded border border-green-500/50 text-green-400 mono text-[11px] uppercase tracking-wider hover:bg-green-500/10" data-i18n="order_wa">WhatsApp</button>
          </div>
          <div id="verify-msg" class="hidden text-sm mono p-3 rounded border"></div>
        </div>
      </section>
    </div>
  </div>

  <script src="js/order-page.js?v=1"></script>

</body>
</html>
