<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>OPS COMMAND | JOM STUDIO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Sora:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    body { background: #050505; color: #ddd; font-family: Sora, system-ui, sans-serif; }
    .mono { font-family: "JetBrains Mono", monospace; }
    .glass { background: rgba(12,12,12,0.95); border: 1px solid #333; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border-bottom: 1px solid #222; padding: 8px 6px; text-align: left; vertical-align: top; }
    th { color: #00F2FF; font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; }
    select, input, button { font-family: "JetBrains Mono", monospace; font-size: 11px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; border: 1px solid #444; }
    .ok { color: #4ade80; border-color: #4ade80; }
    .warn { color: #fbbf24; border-color: #fbbf24; }
    .bad { color: #f87171; border-color: #f87171; }
  </style>
  <script src="js/config.js"></script>
  <script src="js/crm.js"></script>
  <script src="js/tron.js"></script>
  <script src="js/commerce.js"></script>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div id="gate" class="max-w-sm mx-auto mt-24 glass p-6 rounded-xl space-y-4">
    <h1 class="mono text-sm tracking-widest text-cyan-300">OPS // AUTH</h1>
    <input id="pw" type="password" placeholder="Password" class="w-full bg-black border border-white/20 rounded px-3 py-2"/>
    <button id="btn-login" class="w-full bg-cyan-400 text-black font-bold py-2 rounded mono uppercase">Enter</button>
    <p class="text-[10px] text-gray-500 mono">Default en config.js → admin.password (cámbialo)</p>
  </div>

  <div id="app" class="hidden max-w-6xl mx-auto space-y-6">
    <header class="flex flex-wrap justify-between items-center gap-3">
      <div>
        <h1 class="mono text-cyan-300 tracking-widest text-sm">JOM STUDIO // OPS COMMAND</h1>
        <p class="text-xs text-gray-500">Órdenes · Briefs · Export · Verificación TRC20</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button id="btn-export" class="border border-cyan-500/40 text-cyan-300 px-3 py-1.5 rounded mono">Export JSON</button>
        <button id="btn-refresh" class="border border-white/20 px-3 py-1.5 rounded mono">Refresh</button>
        <a href="index.html" class="border border-white/20 px-3 py-1.5 rounded mono text-gray-400">Home</a>
      </div>
    </header>

    <div class="grid md:grid-cols-4 gap-3">
      <div class="glass p-4 rounded-lg"><div class="mono text-[10px] text-gray-500">ORDERS</div><div id="m-orders" class="text-2xl font-bold">0</div></div>
      <div class="glass p-4 rounded-lg"><div class="mono text-[10px] text-gray-500">VERIFIED</div><div id="m-verified" class="text-2xl font-bold text-green-400">0</div></div>
      <div class="glass p-4 rounded-lg"><div class="mono text-[10px] text-gray-500">USDT PIPELINE</div><div id="m-usdt" class="text-2xl font-bold text-cyan-300">0</div></div>
      <div class="glass p-4 rounded-lg"><div class="mono text-[10px] text-gray-500">BRIEFS</div><div id="m-briefs" class="text-2xl font-bold">0</div></div>
    </div>

    <section class="glass rounded-xl p-4 overflow-x-auto">
      <h2 class="mono text-xs text-amber-400 tracking-widest mb-3">ORDERS</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Producto</th><th>Cliente</th><th>USDT</th><th>Status</th><th>Hash</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody id="orders-body"></tbody>
      </table>
    </section>

    <section class="glass rounded-xl p-4 overflow-x-auto">
      <h2 class="mono text-xs text-amber-400 tracking-widest mb-3">BRIEFS</h2>
      <table>
        <thead><tr><th>Fecha</th><th>Nombre</th><th>Email</th><th>Canal</th><th>Brief</th></tr></thead>
        <tbody id="briefs-body"></tbody>
      </table>
    </section>

    <section class="glass rounded-xl p-4">
      <h2 class="mono text-xs text-amber-400 tracking-widest mb-3">WALLET CONFIG</h2>
      <p class="mono text-xs break-all text-cyan-200" id="wallet-show"></p>
      <p class="text-xs text-gray-500 mt-2" id="wallet-status"></p>
    </section>
  </div>

  <script>
    (function () {
      const gate = document.getElementById("gate");
      const app = document.getElementById("app");
      const pwKey = "jom_ops_auth";

      function unlock() {
        gate.classList.add("hidden");
        app.classList.remove("hidden");
        render();
      }

      if (sessionStorage.getItem(pwKey) === "1") unlock();

      document.getElementById("btn-login").onclick = () => {
        const expected = (JOM_CONFIG.admin && JOM_CONFIG.admin.password) || "jom2026";
        if (document.getElementById("pw").value === expected) {
          sessionStorage.setItem(pwKey, "1");
          unlock();
        } else {
          alert("ACCESS DENIED");
        }
      };

      document.getElementById("btn-refresh").onclick = render;
      document.getElementById("btn-export").onclick = () => {
        const blob = new Blob([JSON.stringify(JOM_CRM.exportAll(), null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `jom-crm-${Date.now()}.json`;
        a.click();
      };

      function statusClass(s) {
        if (s === "verified" || s === "delivered") return "ok";
        if (s === "cancelled") return "bad";
        return "warn";
      }

      function render() {
        const orders = JOM_CRM.listOrders();
        const briefs = JOM_CRM.listBriefs();
        document.getElementById("m-orders").textContent = orders.length;
        document.getElementById("m-briefs").textContent = briefs.length;
        document.getElementById("m-verified").textContent = orders.filter((o) => o.status === "verified").length;
        document.getElementById("m-usdt").textContent = orders
          .filter((o) => ["verified", "paid_unverified", "in_progress", "delivered"].includes(o.status))
          .reduce((s, o) => s + (Number(o.amount) || 0), 0);

        const tbody = document.getElementById("orders-body");
        tbody.innerHTML = orders.length
          ? orders
              .map((o) => {
                const tron = o.txHash ? `<a class="text-cyan-400 underline" target="_blank" href="${JOM_TRON.tronscanTxUrl(o.txHash)}">${(o.txHash || "").slice(0, 10)}…</a>` : "—";
                return `<tr>
                  <td class="mono text-[10px]">${o.id}</td>
                  <td>${o.productName}<div class="text-gray-500 text-[10px]">${o.createdAt}</div></td>
                  <td>${o.name}<div class="text-gray-500">${o.email}</div></td>
                  <td class="mono text-cyan-300">${o.amount}</td>
                  <td><span class="pill ${statusClass(o.status)}">${o.status}</span></td>
                  <td class="mono text-[10px]">${tron}</td>
                  <td class="space-y-1">
                    <select data-id="${o.id}" class="status-sel bg-black border border-white/20 rounded px-1 py-0.5">
                      ${["awaiting_payment","paid_unverified","verified","in_progress","delivered","cancelled"]
                        .map((s) => `<option value="${s}" ${s === o.status ? "selected" : ""}>${s}</option>`)
                        .join("")}
                    </select>
                    <button data-reverify="${o.id}" class="block border border-white/20 px-2 py-0.5 rounded reverify">Re-verify</button>
                    <button data-wa="${o.id}" class="block border border-green-500/40 text-green-400 px-2 py-0.5 rounded wa-btn">WA</button>
                  </td>
                </tr>`;
              })
              .join("")
          : `<tr><td colspan="7" class="text-gray-500">Sin órdenes aún.</td></tr>`;

        document.getElementById("briefs-body").innerHTML = briefs.length
          ? briefs
              .map(
                (b) => `<tr>
                <td class="mono text-[10px]">${b.timestamp || b.iso || ""}</td>
                <td>${b.name || ""}</td>
                <td class="text-cyan-200">${b.email || ""}</td>
                <td>${b.channel || ""}</td>
                <td class="max-w-xs truncate" title="${(b.briefText || "").replace(/"/g, "&quot;")}">${b.briefText || ""}</td>
              </tr>`
              )
              .join("")
          : `<tr><td colspan="5" class="text-gray-500">Sin briefs.</td></tr>`;

        document.querySelectorAll(".status-sel").forEach((sel) => {
          sel.onchange = () => {
            JOM_CRM.updateOrder(sel.dataset.id, { status: sel.value });
            render();
          };
        });
        document.querySelectorAll(".reverify").forEach((btn) => {
          btn.onclick = async () => {
            const o = JOM_CRM.getOrder(btn.dataset.reverify);
            if (!o || !o.txHash) return alert("Sin hash");
            btn.textContent = "...";
            const { verify } = await JOM_COMMERCE.attachAndVerifyPayment(o.id, o.txHash);
            alert(verify.message || verify.status);
            render();
          };
        });
        document.querySelectorAll(".wa-btn").forEach((btn) => {
          btn.onclick = () => {
            const o = JOM_CRM.getOrder(btn.dataset.wa);
            if (o) JOM_COMMERCE.openOrderWhatsApp(o);
          };
        });

        document.getElementById("wallet-show").textContent = JOM_CONFIG.crypto.address;
        document.getElementById("wallet-status").textContent = JOM_TRON.isWalletReady()
          ? "Wallet lista para recibir USDT TRC20."
          : "⚠️ Reemplaza crypto.address en js/config.js";
      }
    })();
  </script>
</body>
</html>
